<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href='https://fonts.googleapis.com/css?family=K2D' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Personal Portfolio</title>
</head>

<body>

    <!--nav div-->
    <nav id="navbar">
        <div class="logo"><span>luivien</span></div>
        <nav id="navbar">
            <ul class="nav">
                <li class="list-nav"><a href="#welcome-section">About<a></li><li class="list-nav"><a href="#projects">Projects</a></li>
                <li class="list-nav"><a href="#contact">Contact</a></li>
            </ul>

        </nav>

        <!--nav div end-->

        <main>
            <!-- first change -->
            <!-- welcome-section start -->
            <section id="welcome-section">
                <div class="clip"></div>
                <div class="welcome-container">
                    <h1>Hi, I'm Luis</h1>

                    <p> A self taught Web Developer in training.</p>
                </div>
            </section>
        </main>
        <!-- end of welcome- section-->

        <!--start project-section-->

        <section id="projects">






            <div class="projects-container">

                <h2 class="projects-title">My fcc projects</h2>

                <div class="inner-container">



                    <div class="project-tile one" id="img-one">
                        <!--<img class="project-img" src="https://github.com/noyldr09/technical-documentation-page/blob/master/Technical%20Documentation.png?raw=true" alt="technical-documentation-page">-->
                        <span>Technical documentation</span>
                        <div class="inner-div"></div>
                    </div>



                    <div class="project-tile two" id="img-two">
                        <!--<img class="project-img" src="https://github.com/noyldr09/tribute-f-e-marcos/blob/master/tribute.png?raw=true" alt="tribute">-->
                        <span>Tribute Page</span>
                        <div class="inner-div"></div>
                    </div>



                    <div class="project-tile three" id="img-three">
                        <!--<img class="project-img" src="https://github.com/noyldr09/survey-form/blob/master/survey.png?raw=true" alt="survey-form">-->
                        <span>Survey Form</span>
                        <div class="inner-div"></div>
                    </div>



                    <div class="project-tile four" id="img-four">
                        <!--<img class="project-img" src="https://github.com/noyldr09/product-landing-page/blob/master/landing%20page.png?raw=true" alt="landing-page">-->
                        <span>Landing Page</span>
                        <div class="inner-div"></div>
                    </div>

                </div>

            </div>

            <!-- projects end -->
        </section>

        <div id="contact" class="contact-section">
            <div class="container-form">
                <h4>GET IN TOUCH</h4>
                <form action="">
                    <div class="form-input">
                        <input type="text" required>
                        <label for="name">NAME</label>
                    </div>
                    <div class="form-input">
                        <input type="email" required>
                        <label for="email">EMAIL</label>
                    </div>
                    <div class="form-input">
                        <input type="tel" required>
                        <label for="mobile">MOBILE</label>
                    </div>
                    <div class="form-input">
                        <textarea name="" rows="5" required></textarea>
                        <label for="text">YOUR MESSAGE</label>
                    </div>
                    <button>
    <input type="submit" value="Send message" class="btn">
      </button>
                </form>
            </div>
        </div>
        <footer>
            <div class="icon-footer">
                <i class="fa fa-facebook-square"></i>
                <i class="fa fa-instagram"></i>
                <i class="fa fa-google-plus-square"></i>
                <i class="fa fa-twitter-square"></i>
                <i class="fa fa-youtube-square"></i>
                <span class="span-text">Copyright 2019 All Rights Reserved</span>
            </div>
        </footer>
</body>

</html>
